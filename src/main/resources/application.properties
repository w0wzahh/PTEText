# PTEText - Spring Boot config
# Stock XAMPP defaults; edit for your machine (or use env vars / local profile)

spring.datasource.url=jdbc:mysql://localhost:3306/ptetext_users?noAccessToProcedureBodies=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema comes from sql/ scripts - never let Hibernate touch it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

server.port=8080

# Swagger UI at http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui/index.html
