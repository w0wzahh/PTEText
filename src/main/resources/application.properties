# PTEText - Spring Boot config
# Three real databases, three datasources (see config/*DbConfig.java)
# Stock XAMPP defaults; edit for your machine

spring.datasource.users.url=jdbc:mysql://localhost:3306/ptetext_users?noAccessToProcedureBodies=true
spring.datasource.users.username=root
spring.datasource.users.password=
spring.datasource.users.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.chat.url=jdbc:mysql://localhost:3306/ptetext_chat?noAccessToProcedureBodies=true
spring.datasource.chat.username=root
spring.datasource.chat.password=
spring.datasource.chat.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.system.url=jdbc:mysql://localhost:3306/ptetext_system?noAccessToProcedureBodies=true
spring.datasource.system.username=root
spring.datasource.system.password=
spring.datasource.system.driver-class-name=com.mysql.cj.jdbc.Driver

# schema comes from sql/ scripts - never let Hibernate touch it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

server.port=8080

# Swagger UI at http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui/index.html
